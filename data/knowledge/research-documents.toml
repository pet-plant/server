# A stable id: re-running the sync updates this item instead of adding a copy.
id = "pothos_001"
species_code = "EPAU"
scientific_name = "Epipremnum aureum"
common_name = "Pothos / Golden Pothos / Devil's Ivy"
document_title = "Visual Diagnosis and Care Guide for Epipremnum aureum (Pothos)"
document_body = """
Overwatering and Root Rot

Visual Symptoms: The oldest leaves turn soft, limp, and yellow. Stems may become dark or mushy near the soil line, and the soil stays soggy for days, sometimes emitting a musty smell. Healthy roots are firm and white, while rotted roots are brown and mushy.

Solution: Stop watering and let the soil dry out. If root rot is present, remove the plant from the pot, trim away the brown, mushy roots with sterilized shears, and repot in fresh, well-draining soil.

Recovery Period: 1 to 2 weeks for the plant to stabilize and push new growth once the watering routine is corrected.

Underwatering

Visual Symptoms: The entire plant goes limp and the vines droop significantly. Leaves may turn yellow but feel dry, crispy, and curling. The soil is bone dry, and the pot feels very light when lifted.

Solution: Slowly pour water over the soil until it runs out of the drainage hole, or bottom-water by soaking the pot in a basin of water for 20 to 30 minutes.

Recovery Period: The plant typically perks up and recovers its firmness within a few hours to the same day.

Tap-Water Salts and Mineral Buildup

Visual Symptoms: Yellowing or browning begins at the leaf tips and margins (edges) before spreading to the rest of the leaf. A white crust may also be visible on the soil surface or the rim of the pot.

Solution: Flush the soil thoroughly with plenty of water to leach out accumulated salts and fertilizer residue, and switch to using filtered water or rainwater.

Recovery Period: New, healthy green growth will appear in 2 to 3 weeks after switching the water source and flushing the soil.

Sunburn and Heat Stress

Visual Symptoms: Leaves develop brown or yellow patches from intense light (leaf burn). Alternatively, the plant may wilt during the intense heat of the afternoon but naturally recover its turgor by the evening.

Solution: Move the plant out of direct midday sun to a location with bright, indirect light, or use a sheer curtain to filter the light.

Temperature Stress (Cold Drafts)

Visual Symptoms: Leaves turn yellow or the plant droops at certain times of the day without a clear watering issue.

Solution: Move the plant away from cold windows, air-conditioning vents, or heating systems to a spot with stable temperatures.

Natural Aging (Senescence)

Visual Symptoms: Only one or two of the oldest, lowest leaves on the vine turn yellow and become papery thin, while the tip of the vine continues to push out healthy new growth.

Solution: No treatment is needed as this is a natural aging process. Simply remove the yellow leaf with clean scissors or gently detach it once it releases easily.
"""