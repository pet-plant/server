# One Langfuse dataset. The file stem is the dataset name.
#
# Every [[items]] block is one research document, and one experiment item.
# The keys under an item are exactly the prompt variables the agent compiles
# its template with (mlops.knowledge.contract.PROMPT_VARIABLES), plus `id`.
#
# There is deliberately no expected output: nobody can write the one correct
# probe set for a document, and a metric built on a made-up answer is worse
# than no metric. Automatic scores measure well-formedness; a person judges
# the probes.

description = """
Research documents for the probe-generation agent. Each one is written the way
a real one would be, including the parts that are meant to be *rejected* — the
normal ageing and cosmetic notes a probe must not fire on.
"""

[[items]]
id = "pachira_001"
species_code = "PAAQ"
scientific_name = "Pachira aquatica"
common_name = "Money Tree"
document_title = "Visual Diagnosis and Care Guide for Pachira aquatica"
document_body = """
Overwatering and Root Rot

Visual Symptoms: Leaves turn pale or yellow and droop. The base of the trunk feels soft or mushy to the touch, and the soil remains wet for more than 5 days, possibly with mold or a foul odor.

Solution: Remove the plant from the pot, cut away any black or mushy roots with sterilized shears, and repot in fresh, well-draining soil (e.g., a chunky mix with orchid bark and perlite).

Recovery Period: 1 to 2 months for a new root system to establish.

Underwatering (Water Deficit)

Visual Symptoms: Leaves lose their firmness, become wrinkled, and droop downwards. If left unwatered, leaves turn yellow to brown and fall off easily. The soil is completely dry and the pot is very light.

Solution: Water thoroughly until water flows from the drainage holes, or soak the pot in a bucket of water for 1 to 2 hours.

Recovery Period: A few hours to 1 day for the turgor pressure to return and leaves to perk up.

Sunburn (Light Stress)

Visual Symptoms: Parts of the leaves appear bleached, white, or develop dry, crispy brown patches. This usually happens after suddenly moving the plant to direct sunlight.

Solution: Move the plant to a location with bright, indirect light (e.g., behind a sheer curtain) and trim off the severely damaged leaves.

Recovery Period: 1 to 2 months during the growing season for the plant to push out new foliage.

Lack of Light (Etiolation)

Visual Symptoms: Stems grow abnormally long, thin, and weak (leggy). The new leaves are pale green, and older leaves may drop off one by one.

Solution: Gradually move the plant to a brighter spot over a few weeks to avoid sunburn. Prune back the leggy stems to encourage branching.

Recovery Period: 3 to 6 weeks for dormant buds to activate and grow new shoots after pruning.

Cold Stress

Visual Symptoms: Leaves lose their green color (turning white or yellow), eventually turn brown, and drop off in large numbers. Occurs when exposed to temperatures below 10 degrees Celsius or cold drafts.

Solution: Move to a consistently warm room (above 15 degrees Celsius) away from cold windows and direct heater drafts.

Recovery Period: Several months; the plant will usually remain dormant and only sprout new leaves in the spring once temperatures rise.

Nutrient Deficiency

Visual Symptoms: Varies by nutrient. Nitrogen deficiency causes older leaves to turn yellow. Potassium deficiency causes brown scorching on leaf edges. Iron deficiency causes new leaves to turn pale or white while the veins remain green (interveinal chlorosis).

Solution: Apply a balanced, water-soluble fertilizer or specific micronutrients (like iron) during the growing season.

Recovery Period: 2 to 4 weeks for newly emerging leaves to appear healthy.

Fungal Disease (e.g., Anthracnose)

Visual Symptoms: Small, water-soaked brown spots appear on leaves and rapidly expand into dark brown or black lesions with concentric rings. Holes may form in the center of the spots.

Solution: Isolate the plant, cut off and dispose of infected leaves using sterilized tools, and apply a horticultural fungicide. Improve airflow around the plant.

Recovery Period: 1 to 2 months for the plant to replace the lost foliage during the growing season.

Pests (Spider Mites, Scale, Aphids)

Visual Symptoms: Spider mites cause tiny white stippling on leaves and fine webbing. Scale insects look like white cottony bumps and leave a sticky residue (honeydew) that can grow black sooty mold. Aphids cluster on new growth, causing deformed leaves.

Solution: Wipe the leaves with a damp cloth and apply insecticidal soap, neem oil, or a registered miticide/insecticide.

Recovery Period: 2 to 3 weeks for healthy new growth to resume once the pests are eradicated. Damaged leaves will not heal.
"""

