[project]
name = "pet-plant-server"
version = "0.1.0"
description = "Cloud backend for Pet-Plant: VLM-based plant-health assessment with a character-mediated interface"
requires-python = ">=3.12"

# Fixed baseline only. Each bounded context adds the libraries it needs
# (segmentation / VLM / LLM / ClearML clients, etc.) — those are not pinned here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
# This is an application, not a distributable package: uv only manages the
# virtualenv and the lockfile. Entrypoints are run with `--app-dir src`.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "orchestrator",
    "registry",
    "capture",
    "knowledge",
    "assessment",
    "advice",
    "companion",
    "mlops",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
ignore_missing_imports = true
